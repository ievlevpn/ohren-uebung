# Source: humdrum-tools/inventions, sinfo14.krn (3 voices: upper, middle, lower; no spine splits).
# Tempo: editorial (the file's *MM92 names no source).
# Motive (checked against the score): after a held note, sixteenths Bb-A-G falling to
# F, G, then D-Eb-F (middle voice, beats 1.25-4). The held note before it changes length
# (the middle voice holds Bb for a beat and a quarter, then repeats it; the upper voice
# holds F for three quarters of a beat, then steps down), so the marked motive starts with
# the sixteenths. In the upper voice's answers the fourth interval is a third (Bb-D)
# instead of a step. The middle voice leads (Bb), the upper voice answers (bar 2, on F),
# the lower voice enters on Bb (bar 4). In bar 12 the middle voice follows the upper one
# beat later (stretto).
# 13 statements with at most one interval changed, all marked. Not marked: bar 14 upper,
# bars 15 and 20 middle, which change two intervals.
