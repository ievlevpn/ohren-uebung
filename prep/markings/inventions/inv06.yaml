captions:
  - {at: 0, text: "☞ The lower voice climbs a scale, the countermotive."}
  - {at: 0.5, text: "☞ Against it the motive: a syncopated line falling step by step."}
  - {at: 12.5, text: "☞ The voices swap: the falling line below, the rising scale above."}
  - {at: 60.5, text: "☞ Second half, in B major: the falling line in the lower voice."}
  - {at: 72.5, text: "☞ Swapped again: the falling line above, the scale below."}
