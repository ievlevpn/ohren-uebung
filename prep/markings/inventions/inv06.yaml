# Source: humdrum-tools/inventions, inven06.krn (2 voices: upper, lower; no spine splits).
# 3/8: beats_per_quarter 2, a beat is an eighth, 3 per bar. Repeats not unfolded.
# Motive: the upper voice's syncopated line falling from E (E-D#-D-C#-B-A-G#-F#, each
# tied over the beat) and its sixteenth-note close, bars 1-4. Countermotive: the
# bass's scale rising an octave (E-F#-G#-A-B-C#-D#-E-D#-C#-B-E, beats 0-10). The two
# swap voices every four bars (invertible counterpoint): bars 1, 5, 21, 25, 43, 47.
