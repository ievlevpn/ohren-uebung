# Source: humdrum-tools/inventions, inven12.krn (2 voices: upper, lower; no spine splits).
# 12/8: beats are quarter notes, 6 per bar (a quarter-note beat is two eighths).
# Motive: four repeated A's, a held B, then the first half of bar 2's sixteenths
# (A-G#-A-B-C#-D-C#-D-F#-E-D-C#), beats 0-9. Five statements (bars 1, 3, 9, 11, 18), all
# marked. In bar 9 the upper voice breaks the repeated notes into eighths with leaps
# (F#-F#'-F#-F#-C#-F#): the motive's notes sit at their beats, the others ornament them.
# The repeated notes alone recur in bars 5-6 and 14-15 without the run: not
# marked. The bass's sixteenths in bar 1 are not repeated as a fixed countermotive.
