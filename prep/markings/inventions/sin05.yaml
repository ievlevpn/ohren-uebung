# Source: humdrum-tools/inventions, sinfo05.krn (3 voices: upper, middle, lower; no spine splits).
# Tempo: editorial (the file's *MM60 names no source).
# Motive (checked against the score): the upper voice's sixteenth Bb leading to Eb-F
# (dotted), D held over the barline, C-Db-Eb, C held (beats 1.75-6.25): a dotted figure
# that sinks a step.
# The middle voice imitates it a bar later on F; the upper voice repeats it a step higher
# (bar 3), so the two upper voices overlap like a duet. The lower voice never takes the
# motive: it walks in broken chords, one each bar. The opening returns in bars 30-32, with
# the middle voice leading. Six complete statements, all marked; the sequences of the
# middle section (bars 14-28) vary the motive's intervals and are not marked.
