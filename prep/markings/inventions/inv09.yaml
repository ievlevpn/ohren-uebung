# Motive: the upper voice's first four bars (C-Bb-Ab-G-Ab-F-Db..., beats 0-12).
# Countermotive: the bass's line from beat 0.5 through bar 3 (F-G-Ab-G-F-Eb-Db-C...).
# Both swap voices in bar 5. Complete statements of the motive: bars 1, 5, 29, marked.
