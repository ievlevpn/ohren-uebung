# Source: humdrum-tools/inventions, inven03.krn (2 voices: upper, lower; no spine splits).
# 3/8: beats_per_quarter 2, a beat is an eighth, 3 per bar. The score opens with a
# one-eighth upbeat (the sixteenths D-E) before bar 1: pickup 1, so Bach's bar n starts
# at beat 1 + 3(n-1). Every statement starts on the last eighth of a bar (an upbeat into
# the next); the bar numbers below are the bars they start in.
# Motive: the eight turning sixteenths D-E-F#-E-G-F#-E-D (beats 0-4). In bars 1-2 the
# phrase runs on for two bars, but only these eight notes come back every time (the
# continuation varies: a leap of a fifth, a fourth, a sixth or a step). 15 statements,
# all marked; the bass's sequence in bars 38-40 restates the figure on F#.
