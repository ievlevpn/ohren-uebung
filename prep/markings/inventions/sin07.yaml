# Source: humdrum-tools/inventions, sinfo07.krn (3 voices: upper, middle, lower; no spine splits).
# Tempo: editorial (the file's *MM52 names no source).
# Motive (checked against the score): the upper voice's upbeat B, the leap of a fourth to
# E, then F#-G (held), F#-A-G-F#-E (beats 0.5-6). The sixteenth turn that follows leads
# into a sequence of the motive, a step lower, not a new statement. The middle voice
# answers on F# (bar 3), the lower voice on B (bar 7).
# 13 complete statements, all marked; four of them change one interval (bar 5 upper and
# bars 31 and 33 middle: the held note falls a third, not a step; bar 35 lower: a fourth
# up to A, not a third). Not marked: the sequences in bar 3 (upper) and bar 5
# (middle), which begin inside a sixteenth figure with a third, not a fourth.
