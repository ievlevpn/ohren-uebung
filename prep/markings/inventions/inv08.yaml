  - {at: 33.5, text: "☞ In C major the roles swap: the lower voice leads the canon."}
  - {at: 36.5, text: "☞ The upper voice follows two octaves higher."}
  - {at: 75, text: "☞ The canon returns: the upper voice leads again."}
  - {at: 78, text: "☞ The lower voice follows an octave lower, one bar behind."}
