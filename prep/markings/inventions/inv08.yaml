# Source: humdrum-tools/inventions, inven08.krn (2 voices: upper, lower; no spine splits).
# Canon at the octave, one bar (3 beats) apart, in three passages, checked note by note:
#   bars 1-6: the upper voice leads (from beat 0.5), the lower voice answers an octave
#   lower one bar later (bars 2-7), every note;
#   bars 12-13: the lower voice leads in C major (from beat 33.5), the upper voice answers
#   two octaves higher one bar later (bars 13-14);
#   bars 26-28: the upper voice leads again, the lower voice answers an octave lower one
#   bar later (bars 27-29), as in bars 4-6.
# Between them the voices work the motive freely (in bars 16-18 the arpeggio and the scale
# are exchanged for a bar or two, too short to call a canon).
