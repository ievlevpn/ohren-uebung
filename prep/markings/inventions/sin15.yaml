# Source: humdrum-tools/inventions, sinfo15.krn (3 voices: upper, middle, lower; no spine splits).
# Tempo: editorial (the file's *MM63 names no source).
# 9/16: beat_unit 0.75, a beat is a dotted eighth, 3 per bar (onsets in sixteenths are
# thirds of a beat: the countermotive starts at 4/3). The final chord is
# notated longer than the last bar.
# Motive (checked against the score): the upper voice's first bar, B and the repeated F#
# around G: B-F#-F#-G-F#-F#-B-F#-F# (beats 0-3). The bar repeats on C# (bar 2), then a
# bar of broken chords follows. Countermotive: the lower voice under it, from the fifth
# sixteenth, B-C#-D-C#-B, A# held, B-C#-B-C#-A# (beats 4/3-6). The lower voice takes the
# motive in bar 4 with the countermotive above it; the middle voice enters in bar 7.
# Seven complete statements of the motive and three of the countermotive, all marked.
# Not marked: the upper voice's statements in bars 8 and 10, which hold their first note
# over from the bar before (eight notes, without the motive's first); and the upper
# voice's bar 2, C#-F#-F#-G-F#-F#-C#-F#-F#, where the leaps from and to C# are fifths, not
# fourths (three intervals change size).
