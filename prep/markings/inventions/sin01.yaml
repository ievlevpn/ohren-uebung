# Tempo: editorial (the file's *MM92 names no source).
# Motive (checked against the score): the upper voice's sixteenths after the opening rest,
# a rising octave scale G-A-B-C-D-E-F-G and the turn F-G-A (beats 0.25-3). The bar's last
# four sixteenths (F-A-G-F) vary from statement to statement (in the inversion a step
# replaces the third), so they are not part of the marked motive. The inversion falls an
# octave and turns back up (lower voice, bar 4: F-E-D-C-B-A-G-F, G-F-E).
# The scan with find_entry over every onset found 11 upright and 6 inverted statements, all
# complete (every interval the motive's size in scale steps, rhythm exact); all are marked.
# Not marked: the lower voice's falling scales in bars 7, 17 and 18, which leap up a ninth
# after the run instead of turning by step (sequences, not statements).
