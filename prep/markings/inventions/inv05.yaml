# Source: humdrum-tools/inventions, inven05.krn (2 voices: upper, lower; no spine splits).
# Motive: the upper voice's first three bars (Eb-D-Eb-F-G-Ab, the same a step higher,
# then the falling bar 3), beats 0.5-12. Its countermotive: the bass's sixteenth-note
# line from beat 2.25 to the end of bar 3. The pair comes five times, the voices
# swapping (bars 1, 5, 12, 16, 27); every statement is marked. Bars 9-11 and 20-26 use
# only the motive's one-bar head in sequences (fragments, not marked).
