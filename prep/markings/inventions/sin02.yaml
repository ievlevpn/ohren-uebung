# Source: humdrum-tools/inventions, sinfo02.krn (3 voices: upper, middle, lower; no spine splits).
# Tempo: editorial (the file's *MM120 names no source).
# 12/8: beats_per_quarter 2, a beat is an eighth, 12 per bar.
# Motive: the upper voice's first two bars, a broken C minor chord in eighths (C-G-Eb-Eb-
# C-G), the G held and dropped an octave, then a scale up to Ab, a leap down to B and
# back, falling to D (beats 0-24). The middle voice repeats it an octave lower in bars
# 3-4; against it the upper voice plays the countermotive (Eb and C held, then eighths
# rising from B to F, turning around Eb, and a leap up to a held G). The pair returns in G minor in bars 9-11 (the motive in the lower voice,
# then in the upper voice over the countermotive in the lower voice). Four complete
# statements of the motive and two of the countermotive; all are marked. Elsewhere only
# the broken-chord head comes back, varied (bars 5-6, 13-16, 28-30): fragments, not marked.
