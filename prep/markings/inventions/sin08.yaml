# Tempo: editorial (the file's *MM92 names no source).
# Motive (checked against the score): the middle voice after the opening eighth rest,
# sixteenths C-A, eighths D-C-Bb, sixteenths A-G-C-D-Bb-C (beats 0.5-4). The voices enter
# as in a fugue: middle (from C), upper (bar 2, from F), lower (bar 3, from C). In bars 7 and 8 the
# lower voice follows the upper one beat behind (stretto). In bar 17 the upper and middle
# voices play the motive together, a thirteenth (an octave and a sixth) apart.
# 17 complete statements, all marked; the upper voice's in bar 2 opens with a step
# (F-E) where the motive has a third. Not marked: the middle voice in bar 11 and the lower
# voice in bar 12, sequences that change several intervals.
