# Source: Mutopia BachJS/BWV988/bwv-988-v09 (4/4, beats are quarter notes, 4 per bar).
# Voices from the MIDI, top first: 0 = dux (upper, from beat 0), 1 = comes (a third
# below, from bar 2), 2 = bass. Repeats are not unfolded: 16 bars, 64 beats. Checked bar
# by bar: the upper voice leads in both halves.
id: goldberg-var09
title: Variatio 9
catalogue: BWV 988, 9
key: G major
tempo: 66
beats_per_bar: 4
ensemble: harpsichord
listen_for: canon at the third, one bar apart
techniques: [canon, canon at the third]
order: 9
source: {kind: mutopia, path: BachJS/BWV988/bwv-988-v09}
voices:
  - {name: Dux, texture: solid}
  - {name: Comes, texture: hatch}
  - {name: Bass, texture: stipple}
canon:
  leader: 0
  followers:
    - voice: 1
      rule:
        delay: 4
        interval: -2        # two scale steps down: b' answered by g'
        diatonic: true
        key: G
        pitch_tolerance: 1  # Bach's chromatic adjustments (c#'' answered by a', not a#')
        # free: the comes cadences instead of imitating. First half: the leader's notes
        # from beat 26 (bar 7, third beat) to the double bar. Second half: from beat 58.5
        # (bar 15) to the end; their images would fall on the cadence or past it.
        free: [[26, 32], [58.5, 64]]
captions:
  - {bar: 1, text: "☞ Dux: the tune in the upper voice, over the bass."}
  - {bar: 2, text: "☞ Comes: the same tune a third lower, one bar later."}
