# Source: humdrum-tools/bach-wtc-fugues, wtc1f03.krn (3 voices: soprano, alto, bass).
# Tempo: editorial (the file's *MM106 names no source).
# Spine split: the last bar (55) splits the soprano into two lines; the second line
# (E#, then the chords G#/C#, A#/F#, G#/F#, G#/E#) is kept as secondary notes, so the final
# chords sound whole.
# Subject (checked against the score): the soprano from beat 2.5 of bar 1, G# A# G# F# G#
# E# C# G# F# E# F# D# E# C# D# B# C# (to the C# on the downbeat of bar 3). The answer is
# tonal: C# rises a third (to E#) where the subject rose a step. Forms follow the pitch
# level of notes 3..n: statements at the answer's level (a fifth up) are marked answer
# (bars 3, 10, 24, 44); the bass in bar 14, in another key, opens with the answer's minor
# third (D# F#) and is marked answer. In bars 10, 24 and 51 the opening eighth is split into two
# sixteenths; marked from that beat. The alto in bar 26 ends an octave higher (tail: free).
# Countersubject: the soprano's sixteenths after the subject, from beat 1.5 of bar 3; found
# whole in bars 3, 14 and 44, all marked. Bars 42-46 bring back the exposition's three
# entries at their first pitches.
# 12 complete statements, all marked; none overlap.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
