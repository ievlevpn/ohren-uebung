# beats_per_quarter 2, a beat is an eighth, 9 per bar.
# Tempo: editorial (the file's *MM54 names no source; 54 quarters = 108 eighths).
# Spine splits (source.alternatives): bars 51 and 53, alto, sic/ossia pairs; the main text
# (marked sic) is kept and the alternative reading dropped (one eighth each). No sounding
# note of the main text is lost.
# Voice exchange: in bar 25 the file's spine exchange is commented out, so the soprano's
# opening E (bar 25) and the line it goes on with sit in different spines; that statement
# also changes its tenth note and is not marked.
# Subject (checked against the score): the soprano, A, three eighths' rest, then G# C# A D
# B E C# F# E A, D (a quarter) resolving to C# on the eighth eighth of bar 2 (13 notes). It
# is not a double fugue: no second subject appears. The answer is tonal: E falls a third to
# C# where the subject fell a semitone; it enters in bar 2, while the subject is still
# running, so the exposition's first two entries form a stretto group by this project's
# rule (an entry beginning at least a beat before the previous entry's last note). Forms
# follow the pitch level of notes 3..n. Free heads: the first note held longer (bass bar
# 44, alto 31), an octave away (bass 13, alto 27) or another pitch (alto 42).
# 11 complete statements marked. Not marked (the first eleven notes, then the close
# changed): bass bars 9, 25, 33 and 39, alto 25.
