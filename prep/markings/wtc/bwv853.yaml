# Source: humdrum-tools/bach-wtc-fugues, wtc1f08.krn (3 voices: soprano, alto, bass; no
# spine splits). The prelude is in E-flat minor, the fugue in D-sharp minor.
# Tempo: editorial (the file's *MM74 names no source).
# Subject (checked against the score): the alto, D# A# B A# G# F# G# A# D# G# F# E# D#,
# bars 1-3 (to the D# on beat 3 of bar 3, where the answer enters). The answer is tonal:
# A# rises a fourth to D#, then a third to F# (A# D# F# E# D#...), where the subject rose a
# fifth and a step. Forms follow the notes from note 2 on: only the bar-3 statement has
# the answer's third (the soprano's inversion in bar 64 apart, below); every later statement keeps the subject's step (B after A#), even
# where it opens with a fourth (bars 27, 30, 36, 62, 67, 77) or with C double-sharp-E#
# eighths for the first quarter (bars 57 and 61), so they are marked subject.
# The inversion appears from bar 30, the augmentation (notes twice as long) in bars 62
# (bass), 67 (alto) and 77 (soprano). The soprano in bar 24 turns its last note away
# (tail: free).
# The soprano in bar 64 (beat 3, over the bass's augmentation) inverts the answer, not the
# subject: A♯ D♯ B, a fifth then a third down (the answer's fourth-and-third, mirrored and
# its first leap widened); its second interval is 3 semitones off the inverted subject's,
# 1 off the inverted answer's, so it is matched against the answer (ref: answer).
# 17 complete statements marked; stretto groups are entries that begin at least a beat
# before the previous entry's last note. Not marked (rhythm varied, not found even with a
# free head or tail): the stretto of bars 19-20 (alto, soprano: the tenth note comes half a
# beat late), the bass in bar 24 (intervals changed), the three-voice stretto of bar 52
# and the inverted one of bar 54 (both change their rhythm before the end), and the bass in
# bar 39, the inverted answer without its first note (the opening fifth E♯-A♯ replaced by
# a run D♯ C♯ B to the A♯).
