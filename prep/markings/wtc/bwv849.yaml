# Source: humdrum-tools/bach-wtc-fugues, wtc1f04.krn (5 voices: soprano I, soprano II,
# alto, tenor, bass; no chords, no spine splits). 2/2: beats_per_quarter 0.5, a beat is a
# half note, 2 per bar.
# Tempo: editorial (the file's *MM107 names no source; 107 quarters = 53.5 halves).
# A triple fugue: three subjects, each with its own boundary (checked against the score):
# I   the bass, bars 1-3: C# (whole) B# E (halves) D# (whole), 4 notes. Most later
#     statements open with a half note for the whole (head: short, the rest a half note
#     earlier). The answer is real (the tenor, bar 4, on G#).
# II  the first soprano, bars 36-37: two bars of running eighths, G# F# G# A G# F# E G#,
#     then the same a step lower, F# E F# G# F# E D# F#. The quarters that lead into it
#     vary (E F# in bar 35, C# D# E F# in the bass in bar 44, one D# in bar 46) and are not
#     part of it; where it runs on in sequence (soprano bars 38-40, 83-86; soprano II
#     bars 61-62) only the first two bars are marked. Its answer is on C# (soprano II,
#     bar 49, whose first note is the B held over from bar 48: head free); the tenor
#     inverts it in bars 41-42.
# III the alto, bars 49-50: C#, a fourth up to F# repeated three times, E# D# in eighths,
#     E# (a half note): 7 notes, in quarters from the second quarter of the bar. The
#     answer is real (the tenor, bar 60, on G#).
# Entries name their subject; labels read "subject II", "answer III". Forms follow the
# notes (tests/test_pieces.py wtc_form, per subject): statements at neither the subject's
# nor the answer's level (on F#, D#, E, B, A#, or with the mode changed) carry form_by:
# opening; every subject's opening interval is the same in subject and answer, so
# they are subjects.
# Stretto groups: statements of the same subject that begin at least a beat (a half note)
# before the previous statement's last note: subject I in bars 94-97 (soprano I, soprano
# II, soprano I, bass) and subject III in bar 107 (soprano II and alto together, a third
# apart). The three subjects sound together from bar 49 (I in soprano I from the last
# eighth of bar 48, II in soprano II, III in the alto). Soprano II's entry in bar 12, the
# exposition's fourth, opens G# E# (a third) and goes on as the subject on F#: head free.
# Not marked (find_entry rejects them, or they are not whole):
# - four statements of subject I in major, a perfect fourth for the diminished one (the
#   shape and rhythm kept, too many intervals changed for find_entry): the bass in bar 29
#   (B A# D# C#), the alto in bar 32 (E D# G# F#), soprano I (whole-note head) and
#   soprano II in bar 54 (D C# F# E; A G# C# B);
# - the tenor in bar 100 (subject I broken off after the E, a rest, then subject III);
# - the tenor in bar 98 (subject III with a fifth, G# D#, for the fourth) and soprano I in
#   bar 92 (C# G#, a fifth, then on D#); the tenor in bar 106 (subject III whose first
#   note is the last note of the tenor's statement of bar 105); the alto in bar 113
#   (subject III with its last notes lengthened);
# - subject II's sequences beyond their first two bars.
# Everything else is episode.
