# Source: humdrum-tools/bach-wtc-fugues, wtc1f01.krn (4 voices: soprano, alto, tenor, bass).
# Tempo: editorial (the file's *MM62 names no source).
# Spine splits (source.alternatives): all three are sic/ossia pairs, the Bach-Gesellschaft's
# main text against its printed alternative ("Oder", bar 9); the main text is kept and the
# alternative dropped: bar 4 alto (ossia A4-D4 eighths for the main text's two eighth
# rests), bar 9 soprano (ossia E5 dotted eighth-F#5 sixteenth for two eighths), bar 12
# soprano (ossia A4-G#4 sixteenths for G#4-A4). No sounding note of the main text is lost
# by the splits. The alto's final chord G5/E5 keeps its E5 as a secondary note.
# Subject (checked against the score): the alto from the eighth after the opening rest,
# C D E F G F E A D G A G F E (to the E on beat 3 of bar 2). The answer is real (a fifth
# higher, on G); every statement on G is marked answer. Exposition: alto (C), soprano (G),
# tenor (G), bass (C). No regular countersubject.
# 22 complete statements, all marked; stretto groups are entries that begin at least a
# beat before the previous entry's last note. The bass in bar 17 (on D, beat 66) holds
# its first note a quarter: head: free. Not marked: the tenor in bar 14 (beat 53.5) and
# the soprano in bar 15 (beat 58.5), which break off after the head.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
