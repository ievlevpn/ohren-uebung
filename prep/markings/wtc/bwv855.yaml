# Tempo: editorial (the file's *MM102 names no source).
# Subject (checked against the score): the upper voice, bars 1-2, a broken E minor chord
# and a chromatic fall in sixteenths. The answer is real (the lower voice, on B).
# Countersubject: the upper voice against the answer, bars 3-4 (from its D). Found whole in
# bars 3 (upper), 13 (upper) and 22 (lower: the parts swapped); in bars 11, 30 and 32 only
# its first half, so those are not marked. Bar 19 runs in octaves (two octaves apart);
# from bar 20 the lower voice leads.
# 8 complete statements, all marked; none overlap. Not marked: the upper voice in bar 39,
# which breaks off after the head.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
