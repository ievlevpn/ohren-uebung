# Source: humdrum-tools/bach-wtc-fugues, wtc1f24.krn (4 voices: soprano, alto, tenor, bass;
# no chords).
# Tempo: editorial (the file's *MM58 names no source).
# Spine split: the last two bars (75-76) split the bass for a fifth voice (10 notes), kept as
# secondary notes of the bass.
# Subject (checked against the score): the alto from the second eighth of bar 1, in sighing
# pairs of eighths through all twelve notes, F# D B G F# B A# E D# C B F# E# D C# B# C# A
# F# G#, to the F# on the downbeat of bar 4; the answer enters half a beat later (21 notes). The answer
# is tonal: B falls a step to A where the subject fell a third. Forms follow the pitch
# level of notes 3..n: the soprano in bar 13 (B A, a step) and the bass in bar 38 (E D)
# open like the answer but go on at another level, so they are marked subject. Free tails: the last note comes early or turns away (soprano bar 13,
# alto 21, tenor 44, 53 and 60, bass 70).
# Countersubject: the alto against the answer, from beat 4 of bar 4, a falling line of
# quarters (F# E D C#, B) and a sixteenth run, to the D on the downbeat of bar 7 (15
# notes); whole again in bars 9 (tenor), 13 (bass), 21, 48 (its A held two beats: head
# free), 54 and 58 (soprano); several reach their last note early or turn it (tail: free).
# Not marked: bar 71 (soprano), which leaves out its first note.
# The bass in bar 47 (from its second eighth, on D: D C♯ A F♯ D G F♯ C B A G♯ ...) opens with
# the answer's step (a semitone, where the subject falls a third: 3 semitones off) and
# keeps the answer's shape, a few intervals a semitone wider; it is matched against the
# answer (ref: answer). The soprano's countersubject from bar 48 sounds against it.
# 13 complete statements marked; none overlap. Not marked (the first nine notes, then
# broken off): bars 34-35 (alto, soprano), 41-43 (soprano, alto, bass), 69 (tenor) and 74
# (alto).
