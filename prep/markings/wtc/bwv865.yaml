# Source: humdrum-tools/bach-wtc-fugues, wtc1f20.krn (4 voices: soprano, alto, tenor,
# bass; a fifth from bar 80). 4/4, beats are quarter notes.
# Tempo: editorial (the file's *MM84 names no source).
# The file comments out its last eight bars (bars 80-87, "!! Five-voice material until
# the end", after a `*+` that adds a fifth spine at bar 80); source.commented_from reads
# them again (kern.restore_commented): the added spine is a voice of its own, the "fifth
# voice", silent before bar 80 and above the soprano from there, so nothing sounding is
# dropped (205 notes from bar 80: the 206 the file writes, less the tenor's unison E in
# the last chord). The bass's A held from bar 83 to the end carries its tie into the last
# bar, where the file writes the tie's end on the octave A above it. Checked note for
# note against the Bach-Gesellschaft plate (reference-edition/wtc1f20.pdf, p. 73).
# Bar 69: a sic/ossia pair in the soprano (the edition's "Oder"), the alternative dropped.
# Subject (checked against the score): the alto from the second eighth of bar 1, A G# A B
# C, C B C D, E D C D E F, G# E (17 notes, to the E on the third beat of bar 2). The
# answer is real (the soprano, bar 4, on E).
# Every complete statement is marked: 32 (15 of them inverted), the last the fifth
# voice's on D in bar 84, and four that keep all but the last notes (part: head): the
# bass inverted in bar 62 and the tenor inverted in bar 83 (15 notes), the soprano in
# bar 77 (15) and in bar 85 (16, its E cut off by the cadence). Stretto groups are
# entries that begin at least a beat before the previous entry's last note: twelve
# groups, entries two beats apart (the subject against itself or its inversion); the
# last two, bars 76-77 and 83-85, have three entries each.
# Statements at neither the subject's nor the answer's level (on C, bars 43-44; on D,
# bars 64 and 84) carry form_by: opening; inverted statements are subjects (the answer
# is real).
# Not marked: heads of 9-11 notes (soprano bars 32, 78; alto 17 and 84; tenor 62).
