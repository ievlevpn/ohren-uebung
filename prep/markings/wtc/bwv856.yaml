# Source: humdrum-tools/bach-wtc-fugues, wtc1f11.krn (3 voices: soprano, alto, bass; no
# spine splits). 3/8: beats_per_quarter 2, a beat is an eighth, 3 per bar.
# Tempo: editorial (the file's *MM87 names no source; 87 quarters = 174 eighths).
# Subject (checked against the score): the alto, C D C Bb C, E F G A Bb, C Bb A G A, from
# bar 1 to the A on the second eighth of bar 4. In the strettos Bach holds that A (bars
# 31, 42) and the sixteenths after it vary, so the subject ends there. The answer is tonal:
# F rises a third to A where the subject rose a step; statements opening so are marked
# answer. In bar 51 the soprano's first eighth is split into two sixteenths (C, D); it is
# marked from the D (head: free), so its opening step decides its form.
# 13 complete statements, all marked; stretto groups are entries that begin at least a
# beat before the previous entry's last note. Not marked: the soprano in bar 43, whose
# head is changed.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
