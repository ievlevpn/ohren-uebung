# Subject (checked against the score): the alto from beat 2.5 of bar 1, E F# B C# D#, then
# the sixteenths E D# E F# G# A B G# (to beat 2.75 of bar 2; the soprano's answer has
# entered on beat 2.5). No regular countersubject. The answer
# is real (on B); the statements on B are marked answer. Exposition: alto, soprano, bass;
# the soprano and alto again in bars 6-7.
# 9 complete statements, all marked; none overlap. Not marked: the bass in bar 9 (its
# sixteenths turn away from the subject's) and bar 28 (it breaks off before the end).
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
