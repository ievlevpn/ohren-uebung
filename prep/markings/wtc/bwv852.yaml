# Tempo: editorial (the file's *MM84 names no source).
# Spine split: the last bar (37) splits the soprano; the second line (Db, C, Cb, Bb) is kept
# as secondary notes.
# Subject (checked against the score): the soprano, Bb G F G Eb Ab G Ab C Bb, A F Eb' D C,
# the C trilled and resolving to the Bb on beat 3 of bar 2 (16 notes; every statement
# goes on by that step at that moment). The answer is tonal: Eb falls a step where the
# subject fell a third. Forms follow the pitch level of notes 3..n (the subject's or the
# answer's); in other keys, the opening step (answer) or third (subject).
# head: free — four statements open on a note tied over the barline, which replaces the
# first sixteenth (bars 10-11 soprano, 25-26 bass, 28-29 soprano, whose held note is Ab,
# 33-34 alto); each is placed on its downbeat, and its mark begins with the tied note.
# 9 complete statements marked; none overlap. Not marked: the soprano's head sequence in
# bars 22-23, which breaks off.
