# Source: humdrum-tools/bach-wtc-fugues, wtc1f22.krn (5 voices: soprano I, soprano II,
# alto, tenor, bass; no chords, no spine splits; the file notes that the alto and the
# second soprano exchange registers in bars 29-37). 2/2: beats_per_quarter 0.5, a beat is
# a half note, 2 per bar.
# Tempo: editorial (the file's *MM126 names no source; 126 quarters = 63 halves).
# Subject (checked against the score): the first soprano, Bb F in half notes, then, after
# a quarter's rest, Gb F Eb Db C Db Eb, arching down to C and back up to the dominant F on
# the downbeat of bar 4 (10 notes). The answer enters in bar 3, before the subject ends, so
# the two form a stretto group by this project's rule (an entry beginning at least a beat,
# a half note, before the previous entry's last note), as in bars 25-27. The answer is
# tonal: F falls a fifth to Bb where the subject fell a fourth, leaps a tenth to Db for the
# subject's ninth, and ends on C (G Ab Bb C for C Db Eb F).
# Heads (part: head, head_length: the notes kept): most statements keep the opening and
# then go their own way (the alto in bar 10 after 7 notes, the tenor in 12, bass 15, tenor
# 29, bass 32, both sopranos in 50, bass 48: 6 or 7 notes; soprano II bar 68 and tenor 69
# in the final stretto: 5, F Bb C Bb A; the alto in bar 68: 8, see below). The tenor
# (12), soprano II (27) and bass (48) open with the answer's two changed intervals, more
# than find_entry tolerates in 6 or 7 notes, so their heads are free (the answer's first
# interval not compared).
# Forms follow the notes: the answer's body differs from the subject's, so the intervals
# from note 2 on decide. Soprano II and tenor in bars 68-69 (F Bb C Bb A) and soprano II
# in bars 50 and 55 (Bb Eb F) leap a ninth, the subject's interval (the answer leaps a
# tenth), so they are marked subject; soprano I in bar 25 (Db Ab Cb) and the alto in bar
# 55 (Eb Bb Db) leap the answer's tenth and are marked answer.
# Stretto groups: bars 1-3 and 25-27 (subject and answer overlapping), 50 (soprano I,
# soprano II), 53-55 (tenor, then soprano II and alto together) and the five-voice stretto
# of bars 67-69, each voice a half note after the last. The alto in bar 68 plays all ten
# pitches but compresses the ending (Db Eb in sixteenths, the F half a beat early), so only
# its first eight notes, to the Db, stand where the subject puts them: marked as a head.
# 20 statements marked (8 whole, 12 heads). Not marked: the alto in bar 46, which starts on
# the second quarter and leaves out the rest before the leap (rhythm changed).
