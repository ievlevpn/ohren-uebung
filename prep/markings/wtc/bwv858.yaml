# Source: humdrum-tools/bach-wtc-fugues, wtc1f13.krn (3 voices: soprano, alto, bass; no
# chords, no spine splits).
# Tempo: editorial (the file's *MM72 names no source).
# Subject (checked against the score): the soprano from the second eighth of bar 1, C# F# F
# F# F Eb C#, B C# Eb, C# B A# G# C#, to the A# on the downbeat of bar 3; the answer enters
# half a beat later (16 notes). The answer is tonal: F# rises a fifth to C# where the subject rose a
# fourth. Forms follow the pitch level of notes 3..n: the alto in bar 15 (G# C#, in C#
# major) stands at the answer's level and is marked answer. The bass ends its statements of
# bars 5 and 20 by a leap, not the step (tail: free).
# Countersubject: the soprano against the answer, bar 3 to the C# on the downbeat of bar 5
# (sixteenth figures); whole again in the alto against the bass in bar 5, later only in
# fragments.
# 7 complete statements, all marked; none overlap. Not marked: the soprano's head in bars
# 8-9, 11-12 and 18-19 (the opening figure in longer notes, then broken off).
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
