# Subject (checked against the score): the tenor from the second eighth of bar 1, B A# B C#,
# F# G# A# B C# D# E D# C#, to the B on the downbeat of bar 3; the answer enters half a beat later (14
# notes). The answer is tonal: F# falls a third to D# where the subject fell a semitone.
# Forms follow the pitch level of notes 3..n. Free tails: the soprano in bar 5 holds its C#
# half a beat longer; the alto in bar 16 (the subject in F# major) rises to A# at the end;
# the alto in bar 29 holds its C# longer.
# Inversion: the soprano in bar 18 and the alto in bar 20 (whose first note, B, comes after
# a held C#: head free) turn the subject upside down; both end on a turned last note (tail:
# free).
# 12 complete statements marked; one stretto group (an entry beginning at least a beat
# before the previous entry's last note): bars 20-21, the alto's inversion, then the bass's
# subject. Not marked: the head in longer notes, broken
# off (alto bars 9-10, soprano 14, tenor 26-27).
