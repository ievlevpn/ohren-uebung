# Source: humdrum-tools/bach-wtc-fugues, wtc1f06.krn (3 voices: soprano, alto, bass). 3/4.
# Tempo: editorial (the file's *MM78 names no source).
# Spine split: bars 43-44 split the soprano; the second line (six chords in sixths, then
# A/F#) is kept as secondary notes. The alto's chords there keep every tone too.
# Subject (checked against the score): the soprano from the second eighth of bar 1, D E F G
# E F D C# D Bb G, the G trilled, resolving to the A on the downbeat of bar 3 (12 notes);
# every exposition voice enters the eighth after that A. The answer is real (on A); the
# statements on A are marked answer. Where the cadence turns elsewhere or the A comes
# late (a suspension), the entry has tail: free (bars 21, 22, 23, 27, 29).
# The inversion's head is first heard in the alto in bar 12 (A G F E G, then it turns
# away); the first complete inversion is the alto's in bar 14. 16 complete statements
# marked (5 inverted); stretto groups are entries that begin at least a beat before the
# previous entry's last note.
# Not marked (rhythm or intervals varied, or only the head): the soprano in bar 8, the
# alto in bar 12 (inverted), the bass in bars 14 and 19, alto and bass inverted in bars
# 25-26, the alto in bar 33, soprano and alto (inverted) in bar 35, the parallel
# inversions of alto and bass in bars 36-38, the bass in bar 41 and the alto in bar 43.
