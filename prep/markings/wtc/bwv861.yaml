# Source: humdrum-tools/bach-wtc-fugues, wtc1f16.krn (4 voices: soprano, alto, tenor, bass).
# Tempo: editorial (the file's *MM60 names no source).
# Spine split: the last two bars (33-34) split the alto for a fifth voice (6 notes), kept
# as secondary notes of the alto.
# Subject (checked against the score): the alto from the second eighth of bar 1, D Eb G F#
# G, then A Bb C Bb A, to the Bb on beat 3 of bar 2; the answer enters half a beat later (11 notes). The
# answer is tonal: G rises a minor third to Bb where the subject rose a semitone. Forms
# follow the pitch level of notes 3..n; in other keys the opening interval decides: the bass
# in bar 13 (B-flat major) opens with the answer's third (Bb D, more than find_entry
# tolerates against the subject's step, so its head is free) and is marked answer. In bar 23 the alto splits its first eighth into C and D (marked from the
# C). The soprano in bar 28 turns its last note away (tail: free).
# Countersubject: the alto against the answer, from the G on beat 4 of bar 2, a sixteenth
# turn, to the D on the downbeat of bar 4 (11 notes); whole again in bars 5 (soprano), 6, 15
# and 21 (bass).
# 16 complete statements marked; stretto groups are entries that begin at least a beat
# before the previous entry's last note: bars 17 (bass, alto) and 28 (soprano, tenor). Not
# marked: the alto's head in bar 21 and the inverted heads in bars 14 (tenor) and 32
# (bass), which break off.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
