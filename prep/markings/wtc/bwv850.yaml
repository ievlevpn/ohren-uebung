# Source: humdrum-tools/bach-wtc-fugues, wtc1f05.krn (4 voices: soprano, alto, tenor,
# bass; no spine splits). The bass's octave G2/G3 on the downbeat of bar 22: G3 is the
# voice's note, G2 a secondary note (it sounds, but is no part of an entry).
# Tempo: editorial (the file's *MM60 names no source).
# Subject (checked against the score): the bass from beat 2 of bar 1, the run of 32nds
# D E F# G F# E F# D, then B B A G F# in dotted rhythm (to the F# on the downbeat of
# bar 2). The answer is real (on A); the statements on A are marked answer.
# Exposition: bass (D), tenor (A), alto (D), soprano (A). No regular countersubject.
# 11 complete statements, all marked; none overlap. Not marked: the head (the 32nd run)
# alone, in sequence and in stretto in bars 6, 9-13 and 17-24 (bar 20-21: all four
# voices one beat apart), and the soprano in bar 20, whose dotted tail turns upward.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
