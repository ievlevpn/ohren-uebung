# Source: humdrum-tools/bach-wtc-fugues, wtc1f21.krn (3 voices: soprano, alto, bass; no
# chords, no spine splits).
# Tempo: editorial (the file's *MM100 names no source).
# Subject (checked against the score): the soprano from the second eighth of bar 1, F G F
# Bb D, C A G Bb A G F C' Eb, D, then two bars of the same sixteenth figure (Bb C A Bb C D
# Eb D C Eb, twice), to the D on the downbeat of bar 5; the answer enters half a beat later (38 notes;
# every statement keeps the sixteenths). The answer is tonal: Bb rises a third to D where
# the subject rose a step, and its fifth answers the subject's fourth. Forms follow the
# notes: the alto in bar 41 (Eb G Eb Bb D) has the answer's shape and is marked answer;
# the bass in bar 26 (G Bb G C Eb) has one interval of each and stands in another key, so
# its opening third, the answer's, decides: marked answer.
# Countersubject: the soprano against the answer, from the C after the downbeat of bar 5 to
# the C on the downbeat of bar 9 (27 notes, its repeated eighths ending each bar); whole
# again in bars 9 (alto), 13 (bass, its last note a leap: tail: free), 22 and 41
# (soprano). A second countersubject (the soprano from beat 3 of bar 9, sixteenths after
# rests) recurs in bars 13 (alto) and 26 (soprano); markings hold one countersubject, so it
# is not marked.
# 8 complete statements marked; none overlap.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
