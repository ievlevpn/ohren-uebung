# Tempo: editorial (the file's *MM54 names no source).
# Spine split (source.alternatives): bar 41, alto, a sic/ossia pair; the main text (C4
# eighth) is kept and the alternative reading (Eb4 eighth) dropped. No sounding note of
# the main text is lost.
# Subject (checked against the score): the tenor from beat 2 of bar 1, C Db C B E F Bb A
# Ab G, the G held for two beats and falling to F on the downbeat of bar 4 (11 notes; 8
# of the 10 statements fall to that note on time; the soprano's in bars 13 and 47 turn
# elsewhere: tail: free). The answer is tonal: F rises a minor third to Ab where the
# subject rose a semitone. Forms follow the notes from note 2 on: statements at the
# answer's pitch level (a fifth up) are marked answer, among them bars 19 and 47.
# Countersubject: the tenor against the answer, bar 4 beat 2 to bar 7 (from its Ab); found
# whole in bars 4 (tenor), 7 (alto) and 13 (bass); not in later entries.
# 10 complete statements, all marked; none overlap.
# Statements at neither the subject's nor the answer's pitch level (in another key) carry
# form_by: opening: their opening interval decides the form (each entry's comment says so).
