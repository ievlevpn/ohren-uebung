# Source: transcriptions/bwv1079-violini-in-unisono.yaml (violin I and the bass written:
# Bach's riddle IMSLP10042 (BGA 31.2) page 8, Canones diversi 2.; resolution after
# Kirnberger, IMSLP10042 page 41). Violin II is computed: violin I at the unison, one bar
# later, exactly. The bass is the royal theme. The 8-bar loop is written out four times
# (violin I's pass ends on a crotchet rest, so its span is not the period); violin II
# then finishes its round over the bass's closing C (end/coda, Reccmo's, editorial).
# Tempo editorial.
id: bwv1079-violini-in-unisono
title: Canon a 2 violini in unisono
catalogue: BWV 1079, Canon 2
key: C minor
tempo: 80
beats_per_bar: 4
ensemble: chamber
listen_for: canon at the unison over the royal theme
techniques: [canon, canon at the unison, perpetual canon]
order: 2
source: {kind: transcription, path: transcriptions/bwv1079-violini-in-unisono.yaml}
voices:
  - {name: Violin I, texture: solid, instrument: violin}
  - {name: Violin II, texture: hatch, instrument: violin}
  - {name: Thema, texture: stipple, instrument: cello}
canon:
  leader: 0
  followers:
    - voice: 1
      rule: {delay: 4}
captions:
  - {bar: 1, text: "☞ The royal theme in the bass; violin I begins the canon above it."}
  - {at: 5, text: "☞ Violin II: the same line at the same pitch, one bar later."}
  - {bar: 9, text: "☞ The loop closes: theme and canon begin again, four times round."}
  - {bar: 33, text: "☞ Violin I stops; violin II finishes its round over the closing C."}
# "In this piece" on a definition card; tests/test_glossary_notes.py checks each claim
glossary_notes:
  canon-at-the-unison: "At the unison the two violins share one range, so their lines cross: switch one off to hear the other."
