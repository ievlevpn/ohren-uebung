# Source: craigsapp/bach-musical-offering, kern/offering-002.krn (6 voices; no spine
# splits, no chords; encoded by Craig Stuart Sapp from the Bach-Gesellschaft edition, vol.
# 31.2, IMSLP10042 pp. 12-19, open score in treble, soprano, alto, two tenor and bass
# clefs). The kern bars it in 2/1, two whole notes a bar (103 bars); the BGA bars it in ¢,
# two half notes a bar, so one bar here is two of the plates'. Bar numbers below are the
# kern's. A beat is a half note (beats_per_quarter: 0.5), four a bar.
# Tempo: editorial (56 half notes a minute; the file's *MM170 names no source).
# Subject (checked against the score, p. 12): the royal theme, the alto alone, bars 1-5:
# c' e♭' g' a♭' b, g' f♯' f' e' e♭'~ d' d♭' c' b g c' f' e♭' d' c', to the c' on the
# downbeat of bar 5, where the second soprano enters with the answer. The answer is tonal:
# G B♭ C E♭ F♯ (the theme's G answered by C, not D).
# A strict six-voice fugue. Exposition, one voice every four or six bars: alto (bar 1, C),
# second soprano (5, answer), second tenor (9, C), first tenor (13, answer), first
# soprano (19, C), bass (25, answer). Later statements: second tenor bar 48 (answer, G),
# alto bar 58 (F minor), first soprano bar 66 (the answer's shape on E♭, its third
# major: E♭ G A♭ C D; ref: answer), first tenor bar 73 (B♭ minor), second soprano bar 86 (answer,
# with B♮), bass bar 99 (C, the last: it
# keeps the theme to the F, taken an octave down, then turns into the final cadence:
# part: head, head_length 17, tail: free).
# Bar 86, second soprano: the answer with B♮ for B♭ (G B C E♭ F♯, the natural printed
# on p. 18), then complete. Its second interval is a semitone where the subject has a
# major third (3 semitones off, more than find_entry admits), but one off the first
# answer's whole tone: it is matched against the first answer (ref: answer).
# None overlap: no stretto. No regular countersubject.
# Instruments: harpsichord for all six. The score names no instruments (p. 12: six staves
# in open score); played here as keyboard music. Strings were considered: the upper five
# voices fit violin, viola and cello, but the bass reaches B♭1 (bar 67), below the cello's
# and the organ's C2 in INSTRUMENT_RANGES; only the harpsichord (F1-F6) holds all six.
