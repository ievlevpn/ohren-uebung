# Source: transcriptions/bwv1079-fuga-canonica.yaml (the harpsichord's right hand, the
# dux, and its bass written: Bach's riddle IMSLP10042 (BGA 31.2) pages 10-11, one line
# read in two clefs; resolution IMSLP10042 pages 43-44). The flute is computed: the dux a
# fifth higher (exactly: c' answered by g'), ten bars later; the rule covers the flute
# alone, the bass is free. From beat 271 the dux is free and the flute finishes the canon
# ten bars behind it; its last note is the final chord (end/coda, held under a fermata).
# Tempo editorial.
id: bwv1079-fuga-canonica
title: Fuga canonica in Epidiapente
catalogue: BWV 1079/4
key: C minor
tempo: 112
beats_per_bar: 4
ensemble: chamber
listen_for: canon at the fifth above, ten bars apart, over a free bass
techniques: [canon, canon at the fifth]
order: 6
source: {kind: transcription, path: transcriptions/bwv1079-fuga-canonica.yaml}
voices:
  - {name: Comes, texture: solid, instrument: flute}         # "Flauto e Violino" (p. 43)
  - {name: Dux, texture: hatch, instrument: harpsichord}    # "Cembalo", right hand
  - {name: Bass, texture: stipple, instrument: harpsichord}  # "Cembalo", left hand
canon:
  leader: 1
  followers:
    - voice: 0
      rule: {delay: 40, interval: 7}
captions:
  - {bar: 1, text: "☞ The dux: the royal theme in long notes, over a running bass."}
  - {bar: 11, text: "☞ Comes: the flute plays the dux's line a fifth higher, ten bars later."}
  - {bar: 59, text: "☞ The royal theme again, now in the bass, under the canon."}
  - {at: 271, text: "☞ The dux goes on alone; the flute finishes the canon ten bars behind."}
# "In this piece" on a definition card; tests/test_glossary_notes.py checks each claim
glossary_notes:
  canon-at-an-interval: "The bass is free: only the flute imitates, following the harpsichord's right hand."
