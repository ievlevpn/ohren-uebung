# Source: craigsapp/art-of-the-fugue, kern/artfugue-008.krn ("Contrapunctus 8, a 3."; three
# spines; BGA vol. 25.1, p. 31). ¢ (2/2): beats are quarter notes, 4 per bar. A triple
# fugue: three subjects, each with its own exposition, then combined. Two chord tones in
# bar 38 are secondary notes.
# Tempo: editorial (the file's *MM100 names no source).
# Subject I (alto, bars 1-5): D C F B B♭ A D G F G A G A D, to the D of bar 5.
# Subject II (alto, bar 39): B♭ A♭ A A A F♯ G G G E F F F E D C♯ D, a long note, then
# falling steps in repeated eighths, to the D of bar 42.
# Subject III (alto, bar 94): A D E . F G A . B♭ A G . F E F G A, the main subject of the
# work inverted, broken by rests.
# Entries: every place find_entry finds a subject (scans of all voices for each, checked
# by hand). Subject II's figure also runs on in sequences longer than the subject; only
# statements that begin with its long note are marked, plus the three where all subjects
# sound together (bars 147, 152, 158), whose first note is short. Some statements of
# subject I begin with a quarter for the half note (head: free); bars 22, 79, 113 and 125
# are marked to where they leave the subject (part: head). Bar 67 (bass), a statement
# on G whose second note is changed, is left unmarked. Forms: subject I as in the WTC
# (wtc_form); subjects II and III are labelled subject throughout. Stretto groups:
# statements of one subject beginning at least a half note before the previous one's last
# note.
# Instruments: the alto goes down to B♭2, below the viola: cello, as the bass.
