# Source: craigsapp/art-of-the-fugue, kern/artfugue-010.krn ("Contrapunctus 10, a 4, alla
# Decima"; no splits, no chords; BGA vol. 25.1, p. 43; the file notes "two subjects
# occurring dependently and in invertible counterpoint at the tenth"). C (4/4): beats are
# quarter notes, 4 per bar.
# Tempo: editorial (the file's *MM144 names no source).
# Subject I (alto, bars 1-3): C♯ D A, F E A, then a run up to B♭, to the tenor's entry in
# bar 3 (a stretto from the start; the bass and soprano bring it inverted).
# Subject II (bar 23 on): the subject of Contrapunctus 5, A D (E) F (G) A B♭ A (G) F; the
# reference is the bass's statement in bar 31, the first plain one (the soprano's of bar
# 23 changes its first note, head: free; the alto's of bar 24 turns away after six notes,
# part: head).
# Entries: every place find_entry finds either subject (scans of all voices, checked by
# hand). Late in the piece both subjects are doubled in thirds or tenths, two voices
# stating one subject together (bars 75, 85, 103, 115): both are marked, not as stretto.
# Bar 75, bass: subject I complete (A B♭ F, D C F, B♭ ... as the soprano's of bar 66),
# its fourth to sixth notes an octave down: those two intervals are compared up to the
# octave (octave: [3, 6]). Bar 14, alto (A♭ A F, B♭ A D, then a run): subject I with its
# third interval changed (a fourth for the sixth) against the tenor's inversion; find_entry
# does not accept it, so it is not marked.
# Forms: subject I as in the WTC (wtc_form; the upper voice of a doubled pair changes its
# first interval, bars 52 and 85, and stays labelled subject); subject II is labelled
# subject throughout. Stretto groups: statements of one subject beginning at least a
# half note before the previous one's last note, not counting the doubled pairs.
# Instruments: the tenor goes down to B♭2, below the viola: cello.
