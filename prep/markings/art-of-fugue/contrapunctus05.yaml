# Source: craigsapp/art-of-the-fugue, kern/artfugue-005.krn ("Contrapunctus 5, a 4."; BGA
# vol. 25.1, p. 18). C (4/4): beats are quarter notes, 4 per bar. The file splits a spine
# twice (the closing chords of bars 86-90); read_kern keeps the extra notes as secondary
# notes (12), so nothing sounding is dropped.
# Tempo: editorial (the file's *MM112 names no source).
# The subject: the alto alone, bars 1-4: the inverted subject with passing notes, A D (E) F
# (G) A B♭ A (G) F, to the F of bar 4, where the bass enters with the subject the right
# way up (in the shape of Contrapunctus 6's subject).
# Entries: every place find_entry finds the subject, in either direction (scan of all
# voices and onsets, then checked by hand); forms follow the notes (wtc_form; inverted
# statements are subjects; form_by: opening where a statement stands at neither level).
# Bars 53-54: the head (six notes) in all four voices a quarter apart, each first note
# cut to a quarter (head: free); bars 65-66 the same with the head inverted. In both the
# voices then repeat the head a step lower (a sequence), unmarked. Bar 86: the alto
# enters inverted a quarter after the bass, its first note an F♯ (head: free).
# Stretto groups: entries that begin at least a half note before the previous entry's
# last note.
# Instruments: strings; the tenor stays above C3, within the viola.
