# Source: craigsapp/art-of-the-fugue, kern/artfugue-007.krn ("Contrapunctus 7, a 4. per
# Augment et Diminut"; BGA vol. 25.1, p. 27). C (4/4): beats are quarter notes, 4 per bar.
# One spine split (the soprano, bars 56-61) is kept as 41 secondary notes, nothing dropped.
# Tempo: editorial (the file's *MM92 names no source).
# The subject, as in Contrapunctus 6, is D A G F E D C♯ D E F in the dotted French
# rhythm. Bach never states it at plain length right way up until bar 36, so that
# statement (tenor, D A G F E D C♯ D E F, bars 36-39) is the reference: the others are
# matched against it inverted, in diminution (note values halved) and in augmentation
# (doubled). The piece opens with the subject in diminution (tenor).
# Entries: every place find_entry finds the subject in any form (scan of all voices and
# onsets, then checked by hand). Forms as in Contrapunctus 6: a statement whose first
# leap is a fourth (counted upside down when inverted) is the tonal answer, one whose
# first leap is a fifth the subject. Statements that vary after their opening are marked
# to where they leave the subject (part: head): bars 6, 20 and 55 (seven notes, tenor),
# bar 20 (six, bass) and bar 38 (eight, soprano). A statement whose first note is cut
# short or held over has head: free. Stretto groups: entries that begin at least a beat
# before the previous entry's last note.
# Instruments: the tenor goes down to B2, below the viola: cello.
