# Source: craigsapp/art-of-the-fugue, kern/artfugue-002.krn ("Contrapunctus 2, a 4."; four
# spines, no splits, no chords; encoded by Craig Stuart Sapp from the Bach-Gesellschaft
# edition, vol. 25.1, 1878, p. 6). ¢ (2/2): beats are quarter notes, 4 per bar.
# Tempo: editorial (the file's *MM100 names no source).
# The subject: the bass alone, bars 1-4: the plain subject of Contrapunctus 1 (D A F D C♯ D
# E F G F E), its last bar now in a dotted rhythm (F. G F. E), to the E before the D of
# bar 5, where the tenor enters with the answer.
# Entries: every place find_entry finds the subject (scan of all voices and onsets, then
# checked by hand); forms follow the notes (tests/test_pieces.py wtc_form). Bar 23, alto:
# the subject's first D is replaced by a run up to its A (the G sixteenth before it is
# the statement's place, head: free) and its tail turns chromatic (A A♭ F♯ for G F E), so
# only its first eight notes, to the F, are marked (part: head). Bar 52, bass: on C, its
# first note held a whole bar (head: free). No statement overlaps another by more than a
# half note: no stretto.
# Instruments: the tenor goes down to A2 (bar 7), below the viola: cello.
