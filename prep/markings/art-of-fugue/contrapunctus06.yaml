# Source: Mutopia BachJS/BWV1080/contrapunctusVI (2/2, beats are quarter notes, 4 per
# bar). Voices from the MIDI, top first. "in Stylo Francese": the subject in dotted
# rhythm, against itself inverted and in diminution (half the note values).
# Entries: every place the subject's head (its first ten notes, to the F of bar 4) sounds,
# found by scanning all voices in every form (fugue.find_entry). Bach varies the tail
# from entry to entry, so the head is the reference. An entry whose first leap is a
# fourth is the tonal answer. Stretto groups: entries that overlap in time.
