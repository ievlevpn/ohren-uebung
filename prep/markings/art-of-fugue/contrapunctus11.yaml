# Source: craigsapp/art-of-the-fugue, kern/artfugue-011.krn ("Contrapunctus 11, a 4."; BGA
# vol. 25.1, p. 48; the file notes "three subjects of Contrapunctus 8 in inversion").
# ¢ (2/2): beats are quarter notes, 4 per bar. One spine split and a few chord tones
# (bars 6, 56, 183) are kept as secondary notes (6); nothing is dropped.
# Tempo: editorial (the file's *MM120 names no source).
# A triple fugue on Contrapunctus 8's subjects turned upside down, numbered here in the
# order they enter:
#   I (alto, bars 1-4): D A G . F E D . C♯ D E . F G F E D, Contrapunctus 8's third
#     subject inverted, i.e. the work's main subject broken by rests;
#   II (alto, bars 27-31): A B♭ F C C♯ D A E F E D E D A, Contrapunctus 8's first
#     subject inverted;
#   III (tenor, bar 89): E♭, then rising chromatic steps in repeated eighths (E♭ D F F F
#     E G G G F♯ A A A A♭ B B B), Contrapunctus 8's second subject turned over.
# Entries: every place find_entry finds a subject in either direction (scans of all
# voices, checked by hand; "inverted" here is relative to this piece's subject, so
# subject II inverted is Contrapunctus 8's first subject the right way up). Subject III's
# figure runs on in long sequences; only statements beginning with its long note (or,
# head: free, a long note tied in) are marked, bar 122 to where it turns (part: head); bar
# 145 (alto, at its own pitch, the E♭ cut to an eighth, head: free) is where all three
# subjects sound together.
# Forms: subject I as in the WTC (wtc_form); II and III are labelled subject throughout.
# Bars 158 and 164: subject I and its inversion start together (a mirror pair, not
# stretto). Stretto groups: statements of one subject beginning at least a half note
# before the previous one's last note.
# Instruments: strings; the tenor stays above C3, within the viola.
