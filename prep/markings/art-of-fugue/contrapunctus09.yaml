# Source: craigsapp/art-of-the-fugue, kern/artfugue-009.krn ("Contrapunctus 9, a 4, alla
# Duodecima"; no splits, no chords; BGA vol. 25.1, p. 37; the file notes "two subjects
# occurring dependently and in invertible counterpoint at the twelfth"). C (4/4): beats
# are quarter notes, 4 per bar.
# Tempo: editorial (the file's *MM180 names no source).
# Subject I (alto, bars 1-5): D, the octave leap to D, then a running line, to the A of
# bar 5. Subject II (soprano, bars 35-42): the work's main subject, D A F D C♯ D E F G F E,
# in whole and half notes; from bar 35 every statement of it sounds with one of subject I
# (a beat later), the two exchanging places at the twelfth: subject I above or below,
# a fifth plus an octave from where it stood.
# Entries: every place find_entry finds either subject (scans of all voices, checked by
# hand). Forms: subject I as in the WTC (wtc_form); subject II is labelled subject
# throughout. No statement of one subject overlaps another of the same: no stretto.
# Instruments: strings; the tenor stays above C3, within the viola.
