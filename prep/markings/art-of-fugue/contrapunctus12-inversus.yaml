# Source: craigsapp/art-of-the-fugue, kern/artfugue-018b.krn ("Contrapunctus 18 (XII), a 4.
# (inversus)"; BGA vol. 25.1, p. 55; no splits, no chords). 3/2: the beat is a half note
# (beats_per_quarter: 0.5), 3 per bar.
# Tempo: editorial, as the rectus.
# The mirror of contrapunctus12-rectus: every voice turned upside down (a diatonic mirror
# in D minor; a raised or lowered note sometimes answered a semitone off) and the voices
# exchanged: the rectus soprano is now the bass, alto the tenor, tenor the alto, bass the
# soprano (tests/test_pieces.py checks it note against note).
# The subject: the soprano alone, bars 1-4: the rectus subject upside down, A D F A B♭ A
# G F E F G. Entries: every place find_entry finds it (scan, checked by hand): exactly
# the rectus's, mirrored; forms follow the notes (wtc_form). From bar 21 ornamented, the
# first six notes marked (part: head). No stretto.
# Instruments: the tenor goes down to G2 (the mirror of the rectus alto's E5): cello.
