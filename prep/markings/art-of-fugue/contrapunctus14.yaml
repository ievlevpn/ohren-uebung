# Source: craigsapp/art-of-the-fugue, kern/artfugue-019.krn ("Contrapunctus XIX: Quadruple
# Fugue on the name B-A-C-H", "Unfinished"; no splits, no chords; BGA vol. 25.1, p. 93,
# the "Fuga a 3 Soggetti"). C (4/4): beats are quarter notes, 4 per bar.
# Tempo: editorial (the file's *MM208 names no source).
# Unfinished: the file, like the edition, stops where Bach's manuscript breaks off, in bar
# 239, the tenor alone in the middle of a phrase. Nothing is added: the piece ends there.
# Three subjects, each with its own section, then combined (a fourth, the work's main
# subject, is thought to have been meant to join them; it is not in the notes):
#   I (bass, bars 1-6): D A G F G A D, in long notes;
#   II (alto, bar 115): a running line in eighths, D A D E F E D F E A E F G F E F G;
#   III (tenor, bar 193): B♭ A C B♮, Bach's name in German note names (B = B♭, H = B♮),
#     then C♯ D C♯ B C♯.
# Entries: every place find_entry finds a subject (scans of all voices, checked by hand;
# statements of I with a free head and a free tail, which a seven-note subject in long
# notes fits by chance, are left out). Forms: subject I as in the WTC (wtc_form); II and
# III are labelled subject throughout. Bars 213 and 222 bring B-A-C-H inverted, bar 218
# with its D held long, each marked to its sixth note (part: head). Stretto groups:
# statements of one subject beginning at least a half note before the previous one's last
# note. From bar 234 all three subjects sound together.
# Instruments: strings; the tenor stays above C3, within the viola.
