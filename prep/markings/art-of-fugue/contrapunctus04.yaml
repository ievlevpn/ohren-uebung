# Source: craigsapp/art-of-the-fugue, kern/artfugue-004.krn ("Contrapunctus 4, a 4."; no
# splits, no chords; BGA vol. 25.1, p. 13). ¢ (2/2): beats are quarter notes, 4 per bar.
# Tempo: editorial (the file's *MM100 names no source).
# The subject: the soprano alone, bars 1-4: the inverted subject (as in Contrapunctus 3)
# on A, A D F A B♭ A G F, to the F of bar 4; the answer (alto, bar 5) is D A C E F E D C♯,
# and the two go on differently after it (E F G / C♯ A B C♯).
# Entries: every place find_entry finds the subject (scan, then checked by hand); forms
# follow the notes (wtc_form; form_by: opening where a statement stands at neither the
# subject's nor the answer's pitch level). Bars 61-80: four statements whose fifth note
# leaps a third (F C E G B♭, ...), matched within find_entry's tolerance. Bar 107: the
# bass enters a quarter after the tenor, its sixth note early, so only its first five
# notes are marked (part: head). Bar 111: the soprano a quarter ahead of the alto, its
# first D cut to a quarter (head: free), and from its seventh note varied (part: head).
# Stretto groups: entries that begin at least a half note before the previous entry's
# last note.
# Instruments: the tenor goes down to B2, below the viola: cello.
