# Canon a 4, BWV 1079 — the written voice: Bach's one riddle line, a 28-bar perpetual
# canon (G minor, 4/4), transcribed from the plate (IMSLP10042 p. 20) after the opening
# quarter rest: from beat 1 to the repeat sign, where the line closes on g' (beat 112, a
# crotchet) and goes back to its first note (beat 113). Bach's double clef (a G clef on
# the bottom line and an F clef, one key signature) reads the first note as g' in the
# trebles and G two octaves lower in the basses. The other three voices are computed
# (markings): the BGA's resolution, pp. 50-51. Three passes; every voice is cut at beat
# 336 and holds the note it reaches there (end/coda, editorial: dardel.info's ending).
