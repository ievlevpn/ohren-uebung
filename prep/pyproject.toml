[project]
name = "fugue-prep"
version = "0.1.0"
description = "Data preparation for Ohren-Übung"
requires-python = ">=3.13"
dependencies = [
    "music21",
    "mido",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
